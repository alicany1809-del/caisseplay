<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo - Images Aléatoires</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            cursor: pointer;
            user-select: none;
        }

        .main-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        #info-text {
            font-size: 1.2rem;
            color: #333;
            font-weight: bold;
        }

        .image-box {
            width: 400px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f0f2f5;
            border-radius: 12px;
            overflow: hidden;
            border: 2px dashed #dcdde1;
        }

        img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
        }

        /* Animation d'apparition cool (Fondu + Zoom) */
        @keyframes appearAnimation {
            0% {
                opacity: 0;
                transform: scale(0.8) rotate(-3deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .animate {
            animation: appearAnimation 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        button {
            cursor: pointer;
            padding: 12px 24px;
            font-size: 1rem;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(255, 71, 87, 0.3);
        }

        button:hover {
            background-color: #ff6b81;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 71, 87, 0.4);
        }

        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="main-container">
        <p id="info-text">Cliquez n'importe où sur la page pour afficher une image</p>
        
        <!-- Conteneur de l'image -->
        <div class="image-box">
            <img id="displayed-image" src="" alt="Image aléatoire">
        </div>

        <!-- Bouton pour recommencer à zéro -->
        <button id="reset-btn">Recommencer de zéro</button>
    </div>

            "https://i.ibb.co/v6HBLWNd/image.png", "https://i.ibb.co/bgFsnpcy/image.png"
        ];

        let remainingImages = [];
        let currentIndex = 0;

        const imgElement = document.getElementById("displayed-image");
        const infoText = document.getElementById("info-text");
        const resetBtn = document.getElementById("reset-btn");

        function shuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function initGame() {
            remainingImages = shuffle(imagesList);
            currentIndex = 0;
            imgElement.style.display = "none";
            imgElement.classList.remove("animate");
            infoText.textContent = "Cliquez n'importe où sur la page pour commencer !";
        }

        initGame();

        document.body.addEventListener("click", (event) => {
            if (event.target === resetBtn) return;

            if (currentIndex < remainingImages.length) {
                // Retire l'animation pour pouvoir la relancer à chaque clic
                imgElement.classList.remove("animate");
                
                // Change l'image
                imgElement.src = remainingImages[currentIndex];
                imgElement.style.display = "block";
                
                // Force le navigateur à relancer l'animation (reflow)
                void imgElement.offsetWidth;
                imgElement.classList.add("animate");

                infoText.textContent = `Image ${currentIndex + 1} sur ${imagesList.length}`;
                currentIndex++;
            } else {
                infoText.textContent = "Toutes les images ont été affichées ! Cliquez sur 'Recommencer de zéro'.";
            }
        });

        resetBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            initGame();
        });
    </script>
